<title>H2H Chess</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;500;600;700&family=Teko:wght@500;600;700&display=swap">
<style>
/* Layout: board on the left, a slim "scorer's table" panel on the right; duels take over the screen as a pixel-art arcade cabinet. Single dark theme by choice (night tournament hall). */
:root {
  --night: #191430;
  --panel: #241d42;
  --panel-2: #2e2654;
  --line: #3d3468;
  --ink: #f1e9d6;
  --muted: #a89ec4;
  --brass: #e8b04a;
  --ember: #e2574c;
  --heal: #5fd39a;
  --sq-light: #a8b4c4;
  --sq-dark: #74608f;
  --white-piece: #fbf5e6;
  --black-piece: #2a2142;
  --font-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --font-body: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --font-hud: "Teko", "Bungee", "Impact", "Arial Narrow", sans-serif;
  --font-glyph: "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", "Apple Symbols", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(1200px 600px at 20% -10%, #2a2150 0%, transparent 60%), var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 32px;
}
body.dueling { overflow: hidden; }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 5vw, 44px); margin: 0; letter-spacing: 1px; line-height: 1; text-wrap: balance; }
h1 .hl { color: var(--brass); }
.tag { color: var(--muted); font-size: 14px; max-width: 52ch; margin: 0; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }

/* Board */
.board-frame { background: #120e24; border: 2px solid var(--line); border-radius: 6px; padding: 10px; width: 100%; max-width: 620px; justify-self: center; }
.board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); aspect-ratio: 1; width: 100%; max-width: 100%; user-select: none; -webkit-user-select: none; }
.sq { position: relative; border: 0; padding: 0; margin: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font: inherit; color: inherit; min-width: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.sq.l { background: var(--sq-light); }
.sq.d { background: var(--sq-dark); }
.sq:focus-visible { outline: 3px solid var(--brass); outline-offset: -3px; z-index: 2; }
.sq.last::before { content: ""; position: absolute; inset: 0; background: rgba(232, 176, 74, .28); }
.sq.sel::before { content: ""; position: absolute; inset: 0; background: rgba(232, 176, 74, .55); }
.sq.check::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(226,87,76,.85) 0%, rgba(226,87,76,.2) 70%); }
.sq .dot { position: absolute; width: 26%; height: 26%; border-radius: 50%; background: rgba(25, 20, 48, .45); }
.sq.cap .ring { position: absolute; inset: 6%; border-radius: 50%; border: 4px solid var(--ember); box-shadow: 0 0 0 2px rgba(25,20,48,.35) inset; }
.sq.cap.kingcap .ring { border-color: var(--brass); border-style: dashed; }
.pc { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; width: 100%; }
.glyph { font-family: var(--font-glyph); font-size: min(7.6vw, 50px); line-height: 1; }
.pc.w .glyph { color: var(--white-piece); text-shadow: 0 0 1px #1a1430, 1px 1px 0 #1a1430, -1px -1px 0 #1a1430, 1px -1px 0 #1a1430, -1px 1px 0 #1a1430, 0 3px 4px rgba(0,0,0,.35); }
.pc.b .glyph { color: var(--black-piece); text-shadow: 0 0 1px var(--brass), 1px 1px 0 var(--brass), -1px -1px 0 var(--brass), 1px -1px 0 var(--brass), -1px 1px 0 var(--brass), 0 3px 4px rgba(0,0,0,.35); }
.hpbar { width: 70%; height: 5px; background: rgba(18,14,36,.7); border-radius: 3px; overflow: hidden; margin-top: 2px; }
.hpbar i { display: block; height: 100%; background: var(--heal); }
.hpbar i.mid { background: var(--brass); }
.hpbar i.low { background: var(--ember); }
.pc.healed .glyph { animation: healpulse 1.1s ease-out 1; }
@keyframes healpulse { 0% { filter: drop-shadow(0 0 0 var(--heal)); } 30% { filter: drop-shadow(0 0 10px var(--heal)); } 100% { filter: drop-shadow(0 0 0 var(--heal)); } }
.plus { position: absolute; top: 2%; right: 8%; color: var(--heal); font-weight: 700; font-size: 13px; z-index: 2; animation: rise 1.2s ease-out forwards; text-shadow: 0 1px 2px #000; }
@keyframes rise { from { transform: translateY(6px); opacity: 1; } to { transform: translateY(-10px); opacity: 0; } }
body.board3d .board-frame { padding: 0; position: relative; overflow: hidden; }
body.board3d #board { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
body.board3d .coords { display: none; }
#board3d { display: block; width: 100%; aspect-ratio: 1 / 0.92; border-radius: 4px; touch-action: manipulation; }
.board-frame { position: relative; }
.board-frame.incheck { border-color: var(--ember); animation: checkpulse 1s ease-in-out infinite; }
@keyframes checkpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(226,87,76,0); } 50% { box-shadow: 0 0 0 6px rgba(226,87,76,.55), 0 0 34px rgba(226,87,76,.6); } }
.checkBanner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 5; width: min(92%, 440px); background: rgba(120, 18, 18, .92); border: 2px solid #ff7a6a; border-radius: 8px; padding: 10px 14px; color: #fff; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
.cbX { position: absolute; top: 4px; right: 6px; width: 32px; height: 32px; border: 0; background: transparent; color: #ffd2c8; font-size: 24px; line-height: 1; cursor: pointer; border-radius: 6px; }
.cbX:hover, .cbX:focus-visible { background: rgba(255,255,255,.15); }
.checkBanner b { display: block; font-family: var(--font-display); font-size: 26px; letter-spacing: 3px; color: #ffd2c8; animation: checkblink 1s steps(2) infinite; }
.checkBanner span { font-size: 13px; line-height: 1.35; }
@keyframes checkblink { 50% { opacity: .55; } }
.riskModal { position: absolute; inset: 0; z-index: 6; background: rgba(8, 5, 18, .72); display: flex; align-items: center; justify-content: center; padding: 16px; }
.riskModal[hidden] { display: none; }
.riskBox { background: #1c1534; border: 2px solid var(--ember); border-radius: 10px; padding: 18px; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.riskTitle { font-weight: 700; font-size: 18px; color: #ffb4a8; margin-bottom: 6px; }
.riskBox p { margin: 0 0 14px; font-size: 14px; color: var(--ink); line-height: 1.45; }
.riskBtns { display: flex; gap: 10px; justify-content: flex-end; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--ember); color: #fff; }
@media (prefers-reduced-motion: reduce) { .board-frame.incheck, .checkBanner b { animation: none; } }
.acct-hint { margin: 0; color: var(--muted); font-size: 14px; }
.acct-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.acct-name { font-size: 20px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-rating { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
.acct-rating b { font-family: var(--font-display); font-size: 28px; color: var(--brass); font-weight: 400; }
.acct-rating small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; margin-top: 2px; }
.acct-rank { color: var(--muted); font-size: 13px; }
.acct-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0; }
.acct-stats div { background: var(--panel-2); border-radius: 6px; padding: 6px 8px; min-width: 0; }
.acct-stats dt { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.acct-stats dd { margin: 2px 0 0; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.acct-stats dd.hot { color: var(--heal); } .acct-stats dd.cold { color: var(--ember); }
.acct-delta { font-weight: 600; font-size: 14px; } .acct-delta.up { color: var(--heal); } .acct-delta.down { color: var(--ember); }
.acct-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.acct-where { color: var(--muted); font-size: 12px; }
.dlg { position: fixed; inset: 0; z-index: 50; background: rgba(8, 5, 18, .75); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg[hidden] { display: none; }
.dlgBox { background: #1c1534; border: 2px solid var(--brass); border-radius: 10px; padding: 18px; width: min(380px, 100%); box-shadow: 0 10px 40px rgba(0,0,0,.6); display: flex; flex-direction: column; gap: 10px; }
.dlgBox.warn { border-color: var(--ember); }
.dlgTitle { font-weight: 700; font-size: 18px; }
.dlgBox p { margin: 0; font-size: 14px; color: var(--ink); line-height: 1.45; }
.dlgBox input { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--night); color: var(--ink); }
.gameover { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(circle at 50% 45%, rgba(40,24,80,.82), rgba(5,3,12,.92)); animation: gofade .5s ease-out; }
.gameover[hidden] { display: none; }
@keyframes gofade { from { opacity: 0; } }
.goBox { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 520px; }
.goTitle { font-family: var(--font-display); font-size: clamp(48px, 13vw, 104px); line-height: 1; letter-spacing: 3px; animation: gopop .6s cubic-bezier(.2,1.6,.4,1); }
.goTitle.win { color: var(--brass); text-shadow: 0 0 30px rgba(232,176,74,.7), 0 4px 0 #6a4a10; }
.goTitle.lose { color: var(--ember); text-shadow: 0 0 30px rgba(226,87,76,.7), 0 4px 0 #5a1610; }
.goTitle.draw { color: #9fd3ff; text-shadow: 0 0 30px rgba(159,211,255,.6), 0 4px 0 #1a3a5a; }
@keyframes gopop { from { transform: scale(2.2); opacity: 0; } }
.goReason { font-size: 18px; color: var(--ink); }
.goDelta { font-size: 22px; font-weight: 700; } .goDelta.up { color: var(--heal); } .goDelta.down { color: var(--ember); }
.goBtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.goBtns .btn { font-size: 16px; padding: 10px 22px; }
@media (prefers-reduced-motion: reduce) { .gameover, .goTitle { animation: none; } }
.coords { display: flex; justify-content: space-around; color: var(--muted); font-size: 11px; letter-spacing: .1em; padding-top: 6px; }

/* Side panel */
aside { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 600; }
.turn { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 20px; }
.turn .chip { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--brass); }
.turn .chip.w { background: var(--white-piece); }
.turn .chip.b { background: var(--black-piece); }
.status-note { color: var(--muted); font-size: 14px; min-height: 1.4em; }
.status-note.alert { color: var(--ember); font-weight: 600; }
.status-note.win { color: var(--brass); font-weight: 600; }
.stat-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.stat-head strong { font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.stat-head span { font-variant-numeric: tabular-nums; color: var(--muted); }
.moves { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.moves b { color: var(--brass); font-weight: 600; }
.hint { color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row label { white-space: nowrap; min-width: 8.5em; }
input[type="range"] { flex: 1; accent-color: var(--brass); min-width: 110px; }
select { font: 500 14px var(--font-body); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; flex: 1; min-width: 0; }
select:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 3.2ch; text-align: right; }
button.btn { font: 600 14px var(--font-body); color: var(--night); background: var(--brass); border: 0; border-radius: 4px; padding: 8px 14px; cursor: pointer; letter-spacing: .04em; }
button.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 13px; max-height: 210px; overflow-y: auto; }
.log li { border-left: 3px solid var(--line); padding-left: 8px; color: var(--muted); }
.log li.fight { border-color: var(--ember); color: var(--ink); }
.log li.heal { border-color: var(--heal); }
details summary { cursor: pointer; font-weight: 600; }
details ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: var(--ink); }
kbd { font: 600 12px var(--font-body); background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; color: var(--ink); white-space: nowrap; }
.ctl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; align-items: baseline; margin: 0; }
.ctl dt { color: var(--muted); }
.ctl dd { margin: 0; }
.roster { display: grid; gap: 6px; font-size: 13px; margin: 0; padding: 0; list-style: none; }
.roster b { color: var(--brass); font-weight: 600; }

/* Duel layer: a full-screen broadcast of the fight. Everything inside the screen is sized in --u (1% of the screen width) so the HUD scales with it. */
#fightLayer { position: fixed; inset: 0; z-index: 50; background: #05030c; display: flex; align-items: center; justify-content: center; padding: max(6px, env(safe-area-inset-top, 0px)) max(6px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); touch-action: none; user-select: none; -webkit-user-select: none; }
#fightLayer[hidden] { display: none; }
.cab { position: relative; width: min(100%, calc((100dvh - 74px) * 16 / 9)); display: flex; flex-direction: column; gap: 8px; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 6px; background: #0a0716; overflow: hidden; box-shadow: 0 0 0 1px #3d3468, 0 0 70px rgba(120, 90, 255, .2); }
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#arena { image-rendering: pixelated; }
#arena3d { display: none; }
.three #arena3d { display: block; }
.three #arena { display: none; }
.keys { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; color: var(--muted); font-size: 12.5px; }
.kc { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.kc span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kc .who { font: 600 17px/1 var(--font-hud); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.kc.b { text-align: right; }
.keyhelp { text-align: center; font-size: 12px; line-height: 1.7; white-space: nowrap; }
@media (max-width: 980px) { .keyhelp { display: none; } .keys { grid-template-columns: 1fr 1fr; } }

.hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-hud); --u: 8px; color: #fff; overflow: hidden; line-height: 1; }
.hud::before, .hud::after { content: ""; position: absolute; left: 0; right: 0; height: 0; background: #000; transition: height .35s cubic-bezier(.2, .8, .2, 1); z-index: 1; }
.hud::before { top: 0; } .hud::after { bottom: 0; }
.hud.cine::before, .hud.cine::after, .hud.intro::before, .hud.intro::after { height: 9%; }
.hudTop { position: absolute; left: 2%; right: 2%; top: 2.8%; display: grid; grid-template-columns: 1fr auto 1fr; gap: calc(var(--u) * 1); align-items: start; transition: transform .35s cubic-bezier(.2, .8, .2, 1), opacity .3s; z-index: 2; }
.hud.intro .hudTop, .hud.cine .hudTop { transform: translateY(-160%); opacity: 0; }
.hs { display: flex; gap: calc(var(--u) * .9); align-items: flex-start; min-width: 0; }
.hs.b { flex-direction: row-reverse; text-align: right; }
.hs .gly { flex: none; width: calc(var(--u) * 5.6); height: calc(var(--u) * 5.6); display: grid; place-items: center; font: calc(var(--u) * 4) / 1 var(--font-glyph); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.hs.w .gly { background: linear-gradient(160deg, #f4f8ff, #8fb0e8); color: #1a2550; }
.hs.b .gly { background: linear-gradient(200deg, #4a2f86, #170e30); color: #ffc65a; }
.hs .bars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u) * .5); padding-top: calc(var(--u) * .3); }
.hp { position: relative; height: max(13px, calc(var(--u) * 2.5)); background: rgba(8, 5, 20, .82); transform: skewX(-20deg); outline: calc(var(--u) * .16) solid rgba(255, 255, 255, .78); box-shadow: 0 calc(var(--u) * .4) calc(var(--u) * 1) rgba(0, 0, 0, .6); overflow: hidden; }
.hs.b .hp { transform: skewX(20deg); }
.hp i { position: absolute; top: 0; bottom: 0; right: 0; width: 100%; }
.hs.b .hp i { right: auto; left: 0; }
.hp .lag { background: #ff4a3a; transition: width .5s cubic-bezier(.4, 0, .2, 1) .32s; }
.hs.w .hp .fill { background: linear-gradient(#e6fbff, #5fd0ff 38%, #1f78f0 62%, #1650b8); }
.hs.b .hp .fill { background: linear-gradient(#fff3c4, #ffc24a 38%, #ff8420 62%, #c8500a); }
.hp .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(255, 255, 255, .5), transparent 42%); }
.hp.low .fill { animation: hpLow .5s steps(2) infinite; }
@keyframes hpLow { 50% { filter: brightness(1.6) saturate(1.4) hue-rotate(-18deg); } }
.hp .num { position: absolute; top: 50%; left: calc(var(--u) * 1); transform: translateY(-46%) skewX(20deg); font: 600 max(10px, calc(var(--u) * 1.75)) / 1 var(--font-hud); letter-spacing: .04em; color: #fff; text-shadow: 0 0 calc(var(--u) * .5) #000, 0 1px 0 #000; }
.hs.b .hp .num { left: auto; right: calc(var(--u) * 1); transform: translateY(-46%) skewX(-20deg); }
.under { display: flex; align-items: baseline; gap: calc(var(--u) * .9); justify-content: flex-end; min-width: 0; }
.hs.b .under { flex-direction: row-reverse; }
.under .nm { font: italic 700 max(12px, calc(var(--u) * 2.6)) / 1 var(--font-hud); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; text-shadow: 0 calc(var(--u) * .2) 0 #000, 0 0 calc(var(--u) * .8) rgba(0, 0, 0, .8); }
.under .role { font: 600 max(9px, calc(var(--u) * 1.5)) / 1 var(--font-hud); letter-spacing: .12em; padding: calc(var(--u) * .25) calc(var(--u) * .6) calc(var(--u) * .1); background: rgba(8, 5, 20, .7); white-space: nowrap; }
.under .role.att { color: #ff9a8a; } .under .role.def { color: #9fd3ff; }
.spRow { display: flex; align-items: center; gap: calc(var(--u) * .9); justify-content: flex-end; }
.hs.b .spRow { flex-direction: row-reverse; }
.sp { display: flex; gap: calc(var(--u) * .5); transform: skewX(-20deg); }
.hs.b .sp { transform: skewX(20deg); flex-direction: row-reverse; }
.sp i { display: block; width: calc(var(--u) * 7.5); height: max(5px, calc(var(--u) * 1)); background: rgba(8, 5, 20, .82); outline: calc(var(--u) * .12) solid rgba(255, 255, 255, .45); overflow: hidden; }
.sp i u { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7a5cff, #c8a8ff); margin-left: auto; }
.hs.b .sp i u { margin-left: 0; }
.sp i.full u { background: linear-gradient(90deg, #b48cff, #fff); box-shadow: 0 0 calc(var(--u) * 1) #b48cff; }
.sp.ready i.full { animation: spReady 1s ease-in-out infinite; }
@keyframes spReady { 50% { filter: brightness(1.5); } }
.spRow .tag { font: italic 700 max(10px, calc(var(--u) * 1.7)) / 1 var(--font-hud); letter-spacing: .1em; color: #ff5a4a; text-shadow: 0 0 calc(var(--u) * .8) rgba(255, 60, 30, .9), 0 1px 0 #000; white-space: nowrap; }
